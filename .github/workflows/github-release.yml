name: GitHub Release

on:
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        description: 'GitHub token for release creation'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio esptool
    
    - name: Install xxd
      run: |
        sudo apt-get update
        sudo apt-get install xxd
    
    - name: Build Firmware
      run: |
        VERSION=$(grep '^version = ' platformio.ini | cut -d'"' -f2)
        
        # Always build firmware and LittleFS
        echo "Building firmware and LittleFS..."
        pio run -e esp32dev
        pio run -t buildfs
        
        # Copy firmware binary
        cp .pio/build/esp32dev/firmware.bin .pio/build/esp32dev/upgrade_filaman_firmware_v${VERSION}.bin
        
        # Create LittleFS binary - direct copy without header
        cp .pio/build/esp32dev/littlefs.bin .pio/build/esp32dev/upgrade_filaman_website_v${VERSION}.bin
        
        # Create full binary (always)
        cd .pio/build/esp32dev
        echo "Creating full binary with esptool.py..."
        esptool.py --chip esp32 merge_bin \
          --fill-flash-size 4MB \
          --flash_mode dio \
          --flash_freq 40m \
          --flash_size 4MB \
          -o filaman_full_${VERSION}.bin \
          0x1000 bootloader.bin \
          0x8000 partitions.bin \
          0x10000 firmware.bin \
          0x3D0000 littlefs.bin

        # Verify file sizes
        echo "File sizes:"
        ls -lh *.bin

        # Verify full binary was created
        if [ ! -f "filaman_full_${VERSION}.bin" ]; then
          echo "Error: Full binary was not created!"
          exit 1
        fi

        cd ../../..
    
    - name: Get version from platformio.ini
      id: get_version
      run: |
        VERSION=$(grep '^version = ' platformio.ini | cut -d'"' -f2)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
    - name: Generate Release Notes
      id: release_notes
      run: |
        VERSION=$(grep '^version = ' platformio.ini | cut -d'"' -f2)
        echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
        echo "## FilaMan v${VERSION} - Bugfix Release" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### Fixed" >> $GITHUB_OUTPUT
        echo "- Fix ACE Pro binary write not saving unique NFC tag ID to Spoolman" >> $GITHUB_OUTPUT
        echo "  - Physical NFC UID is now converted to hex string after tag detection" >> $GITHUB_OUTPUT
        echo "  - \`updateSpoolTagId()\` is called after successful write to store \`nfc_id\` in Spoolman" >> $GITHUB_OUTPUT
        echo "  - Matches behavior of JSON write path for consistent tag tracking" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### Installation" >> $GITHUB_OUTPUT
        echo "Download the appropriate binary for your needs:" >> $GITHUB_OUTPUT
        echo "- **filaman_full_${VERSION}.bin** - Complete firmware (recommended for first-time installation)" >> $GITHUB_OUTPUT
        echo "- **upgrade_filaman_firmware_v${VERSION}.bin** - Firmware only (for OTA updates)" >> $GITHUB_OUTPUT
        echo "- **upgrade_filaman_website_v${VERSION}.bin** - Web interface only (for UI updates)" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### Documentation" >> $GITHUB_OUTPUT
        echo "For detailed setup instructions and feature documentation, please visit the [GitHub repository](https://github.com/Anzarion/Filaman)." >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        cd .pio/build/esp32dev

        # Write release notes to file to avoid shell escaping issues
        cat > release_notes.txt << 'NOTES_EOF'
        ${{ steps.release_notes.outputs.CHANGES }}
        NOTES_EOF

        # Create release with available files
        FILES_TO_UPLOAD=""

        # Always add firmware
        if [ -f "upgrade_filaman_firmware_v${VERSION}.bin" ]; then
          FILES_TO_UPLOAD="$FILES_TO_UPLOAD upgrade_filaman_firmware_v${VERSION}.bin"
        fi

        # Add LittleFS and full binary only if they exist
        if [ -f "upgrade_filaman_website_v${VERSION}.bin" ]; then
          FILES_TO_UPLOAD="$FILES_TO_UPLOAD upgrade_filaman_website_v${VERSION}.bin"
        fi

        if [ -f "filaman_full_${VERSION}.bin" ]; then
          FILES_TO_UPLOAD="$FILES_TO_UPLOAD filaman_full_${VERSION}.bin"
        fi

        # Create release with available files
        if [ -n "$FILES_TO_UPLOAD" ]; then
          gh release create "v${VERSION}" \
            --title "Release ${VERSION}" \
            --notes-file release_notes.txt \
            $FILES_TO_UPLOAD
        else
          echo "Error: No files found to upload"
          exit 1
        fi